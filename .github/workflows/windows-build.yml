name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1
      - run: npm ci
      - name: Ensure Electron runtime
        run: npm rebuild electron --foreground-scripts
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: SONORA-Studio-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

